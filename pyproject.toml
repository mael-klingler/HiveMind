# HiveMind - AI Agent Orchestrator
# https://github.com/maelklingler/hivemind

[project]
name = "hivemind"
version = "1.0.0"
description = "AI Agent Orchestrator with multi-VCS support, Kubernetes pod management, and Supabase integration"
readme = "Orchestrator/README.md"
license = {text = "Apache-2.0"}
requires-python = ">=3.10"
authors = [
    {name = "Mael Klingler"},
]
dependencies = [
    "fastapi>=0.104.0",
    "uvicorn[standard]>=0.24.0",
    "httpx>=0.25.0",
    "websockets>=12.0",
    "kubernetes>=28.1.0",
    "psycopg2-binary>=2.9.9",
    "pyyaml>=6.0",
    "supabase>=2.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-asyncio>=0.21",
    "ruff>=0.1.0",
    "mypy>=1.0",
]

[tool.ruff]
target-version = "py310"
line-length = 120
select = ["E", "F", "W", "I", "N", "UP", "B", "A", "SIM", "RUF"]
ignore = ["E501"]

[tool.ruff.isort]
known-first-party = ["database", "config", "middleware"]

[tool.pytest.ini_options]
testpaths = ["Orchestrator/tests"]
python_files = "test_*.py"

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"