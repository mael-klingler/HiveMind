name: HiveMind CI/CD

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  release:
    types: [published]

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ghcr.io/${{ github.repository }}

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    if: github.event_name == 'push' || github.event_name == 'pull_request'
    env:
      DATABASE_URL: postgresql://github:github@localhost:5432/hivemind
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_DB: hivemind
          POSTGRES_USER: github
          POSTGRES_PASSWORD: github
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r Orchestrator/requirements.txt pytest

      - name: Run tests
        run: cd Orchestrator && python -m pytest tests/ -v --tb=short

      - name: Lint (py_compile)
        run: cd Orchestrator && python -m py_compile server.py main.py database.py database_pg.py pod_builder.py gitlab_client.py k8s_client.py