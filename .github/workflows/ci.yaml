name: HiveMind CI/CD

on:
  push:
    branches: [main, development]
    tags: ['v*']
  pull_request:
    branches: [main]

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ghcr.io/${{ github.repository }}

jobs:
  test-go:
    name: Test (Go)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_DB: hivemind
          POSTGRES_USER: github
          POSTGRES_PASSWORD: github
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go 1.23
        uses: actions/setup-go@v5
        with:
          go-version: '1.23'

      - name: Install just
        run: cargo install just || curl -fsSL https://just.systems/install.sh | bash -s -- --to /usr/local/bin

      - name: Run Go CI
        run: just ci-go
        env:
          DATABASE_URL: postgresql://github:github@localhost:5432/hivemind

  test-python:
    name: Test (Python)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r Orchestrator/requirements.txt pytest

      - name: Install just
        run: cargo install just || curl -fsSL https://just.systems/install.sh | bash -s -- --to /usr/local/bin

      - name: Run Python CI
        run: just ci-python

  build:
    name: Build Images
    runs-on: ubuntu-latest
    needs: [test-go, test-python]
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/development')
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install just
        run: cargo install just || curl -fsSL https://just.systems/install.sh | bash -s -- --to /usr/local/bin

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push orchestrator image
        run: just docker-build-go

      - name: Build and push agent image
        run: just docker-build-agent