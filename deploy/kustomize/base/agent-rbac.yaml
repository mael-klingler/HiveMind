apiVersion: v1
kind: ServiceAccount
metadata:
  name: agent-runner
  namespace: hivemind
  labels:
    app.kubernetes.io/name: hivemind
    app.kubernetes.io/component: agent
automountServiceAccountToken: false
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: agent-runner-role
  namespace: hivemind
rules: []
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: agent-runner-binding
  namespace: hivemind
subjects:
- kind: ServiceAccount
  name: agent-runner
  namespace: hivemind
roleRef:
  kind: Role
  name: agent-runner-role
  apiGroup: rbac.authorization.k8s.io