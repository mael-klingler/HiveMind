apiVersion: v1
kind: Pod
metadata:
  name: hivemind-worker
  namespace: hivemind
  labels:
    app.kubernetes.io/name: hivemind
    app.kubernetes.io/component: agent
spec:
  restartPolicy: Never

  volumes:
    - name: workspace
      emptyDir: {}
    - name: repos-config
      configMap:
        name: agent-repos
    - name: task-prompt
      configMap:
        name: agent-assignment
    - name: agent-ssh
      secret:
        secretName: gitlab-agent-credentials
        defaultMode: 0600
    - name: agent-env
      secret:
        secretName: gitlab-agent-credentials

  initContainers:
    - name: clone-repos
      image: alpine:3.21
      volumeMounts:
        - name: workspace
          mountPath: /workspace
        - name: repos-config
          mountPath: /config
        - name: agent-ssh
          mountPath: /root/.ssh
      env:
        - name: GIT_SSH_COMMAND
          value: "ssh -i /root/.ssh/ssh-privatekey -o StrictHostKeyChecking=no -o IdentitiesOnly=yes"
      command: ["/bin/sh", "-c"]
      args:
        - |
          apk add --no-cache git openssh-client jq bash

          if [ ! -f /config/repos.json ]; then
            echo "❌ repos.json nicht gefunden"
            exit 1
          fi

          echo "🔑 Git-Agent SSH Key wird konfiguriert..."

          for repo in $(jq -r 'keys[]' /config/repos.json); do
            url=$(jq -r ".[\"$repo\"]" /config/repos.json)
            echo "⬇️  Klone $repo ($url)..."
            git clone "$url" "/workspace/$repo" || echo "⚠️  Klonen von $repo fehlgeschlagen"
          done

          echo "✅ Alle Repos geklont:"
          ls -1 /workspace/

  containers:
    - name: opencode-agent
      image: hivemind-opencode:latest
      imagePullPolicy: IfNotPresent
      volumeMounts:
        - name: workspace
          mountPath: /workspace
        - name: task-prompt
          mountPath: /etc/agent
        - name: agent-ssh
          mountPath: /root/.ssh
        - name: agent-env
          mountPath: /etc/agent/env
      env:
        - name: GITLAB_TOKEN
          valueFrom:
            secretKeyRef:
              name: gitlab-agent-credentials
              key: GITLAB_TOKEN
        - name: GIT_SSH_COMMAND
          value: "ssh -i /root/.ssh/ssh-privatekey -o StrictHostKeyChecking=no -o IdentitiesOnly=yes"
        - name: GITLAB_HOST
          value: "gitlab.com"
      resources:
        requests:
          cpu: "500m"
          memory: "1Gi"
        limits:
          cpu: "4"
          memory: "8Gi"
