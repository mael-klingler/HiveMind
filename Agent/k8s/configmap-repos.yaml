apiVersion: v1
kind: ConfigMap
metadata:
  name: agent-repos
  namespace: hivemind
  labels:
    app.kubernetes.io/name: hivemind
    app.kubernetes.io/component: agent
data:
  repos.json: |
    {
      "auth-service": "git@YOUR_GITLAB_HOST:myorg/services/auth.git",
      "api-gateway": "git@YOUR_GITLAB_HOST:myorg/services/gateway.git",
      "frontend": "git@YOUR_GITLAB_HOST:myorg/frontend.git"
    }
