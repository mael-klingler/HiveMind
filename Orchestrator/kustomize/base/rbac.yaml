apiVersion: v1
kind: ServiceAccount
metadata:
  name: orchestrator
  namespace: hivemind

---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: orchestrator-agent-manager
  namespace: hivemind
rules:
- apiGroups: [""]
  resources: ["configmaps", "secrets"]
  verbs: ["create", "update", "patch", "delete", "get", "list", "watch"]
- apiGroups: [""]
  resources: ["pods"]
  verbs: ["create", "update", "patch", "delete", "get", "list", "watch"]
- apiGroups: [""]
  resources: ["pods/log"]
  verbs: ["get", "list"]
- apiGroups: [""]
  resources: ["services"]
  verbs: ["create", "update", "patch", "delete", "get", "list"]
- apiGroups: [""]
  resources: ["namespaces"]
  verbs: ["get", "list", "watch"]

---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: orchestrator-agent-manager
  namespace: hivemind
subjects:
  - kind: ServiceAccount
    name: orchestrator
    namespace: hivemind
roleRef:
  kind: Role
  name: orchestrator-agent-manager
  apiGroup: rbac.authorization.k8s.io
