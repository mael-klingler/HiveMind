apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: hivemind-orchestrator
  namespace: hivemind
  annotations:
    nginx.ingress.kubernetes.io/websocket-services: "orchestrator"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-body-size: "50m"
    cert-manager.io/issuer: capturecore-ca
    cert-manager.io/issuer-kind: ClusterIssuer
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - hivemind.capturecore.org
      secretName: hivemind-tls
  rules:
    - host: hivemind.capturecore.org
      http:
        paths:
          - path: /agent-session
            pathType: Prefix
            backend:
              service:
                name: orchestrator
                port:
                  number: 8080
          - path: /
            pathType: Prefix
            backend:
              service:
                name: orchestrator
                port:
                  number: 8080