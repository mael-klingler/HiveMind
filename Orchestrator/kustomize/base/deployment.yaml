apiVersion: apps/v1
kind: Deployment
metadata:
  name: orchestrator
  namespace: hivemind
spec:
  replicas: 1
  selector:
    matchLabels:
      app: orchestrator
  template:
    metadata:
      labels:
        app: orchestrator
    spec:
      serviceAccountName: orchestrator
      imagePullSecrets:
        - name: harbor-registry-secret
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
      initContainers:
      - name: repo-init
        image: reg.capturecore.org/capturecore/hivemind-orchestrator:latest
        imagePullPolicy: Always
        securityContext:
          runAsNonRoot: true
          runAsUser: 1000
          runAsGroup: 1000
        command: ["python3", "-m", "main", "init"]
        envFrom:
        - secretRef:
            name: orchestrator-env
        env:
        - name: ORCHESTRATOR_CONFIG
          value: "/app/config/orchestrator_config.json"
        - name: SSL_CERT_FILE
          value: /etc/ssl/capturecore/ca.crt
        - name: REQUESTS_CA_BUNDLE
          value: /etc/ssl/capturecore/ca.crt
        volumeMounts:
        - name: config
          mountPath: /app/config
          readOnly: true
        - name: repo-storage
          mountPath: /app/workspace/repos
        - name: workspace
          mountPath: /app/workspace
        - name: db-storage
          mountPath: /app/data
        - name: ca-cert
          mountPath: /etc/ssl/capturecore
          readOnly: true
      containers:
      - name: orchestrator
        image: reg.capturecore.org/capturecore/hivemind-orchestrator:latest
        imagePullPolicy: Always
        securityContext:
          runAsNonRoot: true
          runAsUser: 1000
          runAsGroup: 1000
        ports:
        - containerPort: 8080
          name: http
        envFrom:
        - secretRef:
            name: orchestrator-env
        env:
        - name: ORCHESTRATOR_CONFIG
          value: "/app/config/orchestrator_config.json"
        - name: SSL_CERT_FILE
          value: /etc/ssl/capturecore/ca.crt
        - name: REQUESTS_CA_BUNDLE
          value: /etc/ssl/capturecore/ca.crt
        volumeMounts:
        - name: config
          mountPath: /app/config
          readOnly: true
        - name: repo-storage
          mountPath: /app/workspace/repos
        - name: workspace
          mountPath: /app/workspace
        - name: db-storage
          mountPath: /app/data
        - name: ca-cert
          mountPath: /etc/ssl/capturecore
          readOnly: true
        livenessProbe:
          httpGet:
            path: /healthz
            port: http
          initialDelaySeconds: 30
          periodSeconds: 30
          timeoutSeconds: 5
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /readyz
            port: http
          initialDelaySeconds: 10
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
      volumes:
      - name: config
        configMap:
          name: orchestrator-config
      - name: repo-storage
        persistentVolumeClaim:
          claimName: orchestrator-repos
      - name: workspace
        emptyDir: {}
      - name: db-storage
        persistentVolumeClaim:
          claimName: orchestrator-db
      - name: ca-cert
        configMap:
          name: capturecore-ca