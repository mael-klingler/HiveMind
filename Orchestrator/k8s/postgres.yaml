apiVersion: v1
kind: Secret
metadata:
  name: hivemind-postgres
  namespace: hivemind
type: Opaque
stringData:
  POSTGRES_USER: hivemind
  POSTGRES_PASSWORD: hivemind
  DATABASE_URL: "postgresql://hivemind:hivemind@hivemind-postgres:5432/hivemind"
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: hivemind-postgres-data
  namespace: hivemind
spec:
  storageClassName: longhorn-fast
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 5Gi
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: hivemind-postgres
  namespace: hivemind
spec:
  serviceName: hivemind-postgres
  replicas: 1
  selector:
    matchLabels:
      app: hivemind-postgres
  template:
    metadata:
      labels:
        app: hivemind-postgres
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 999
        runAsGroup: 999
        fsGroup: 999
      containers:
        - name: postgres
          image: postgres:16-alpine
          ports:
            - containerPort: 5432
              name: postgres
          env:
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: hivemind-postgres
                  key: POSTGRES_USER
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: hivemind-postgres
                  key: POSTGRES_PASSWORD
            - name: POSTGRES_DB
              value: hivemind
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          volumeMounts:
            - name: postgres-data
              mountPath: /var/lib/postgresql/data
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 1Gi
          livenessProbe:
            exec:
              command:
                - pg_isready
                - -U
                - hivemind
            initialDelaySeconds: 30
            periodSeconds: 10
          readinessProbe:
            exec:
              command:
                - pg_isready
                - -U
                - hivemind
            initialDelaySeconds: 5
            periodSeconds: 5
      volumes:
        - name: postgres-data
          persistentVolumeClaim:
            claimName: hivemind-postgres-data
---
apiVersion: v1
kind: Service
metadata:
  name: hivemind-postgres
  namespace: hivemind
spec:
  selector:
    app: hivemind-postgres
  ports:
    - port: 5432
      targetPort: 5432
  clusterIP: None