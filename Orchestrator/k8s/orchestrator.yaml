apiVersion: v1
kind: Namespace
metadata:
  name: hivemind
  labels:
    app.kubernetes.io/name: hivemind
    app.kubernetes.io/component: platform
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: orchestrator
  namespace: hivemind
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: orchestrator-agent-manager
  namespace: hivemind
rules:
  - apiGroups: [""]
    resources: ["configmaps"]
    verbs: ["create", "update", "patch", "delete", "get", "list"]
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["create", "update", "patch", "delete", "get", "list", "watch"]
  - apiGroups: [""]
    resources: ["pods/log"]
    verbs: ["get", "list"]
  - apiGroups: [""]
    resources: ["services"]
    verbs: ["create", "update", "patch", "delete", "get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: orchestrator-agent-manager
  namespace: hivemind
subjects:
  - kind: ServiceAccount
    name: orchestrator
    namespace: hivemind
roleRef:
  kind: Role
  name: orchestrator-agent-manager
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: v1
kind: Secret
metadata:
  name: gitlab-agent-credentials
  namespace: hivemind
type: Opaque
stringData:
  ssh-privatekey: |
    -----BEGIN OPENSSH PRIVATE KEY-----
    PLACEHOLDER
    -----END OPENSSH PRIVATE KEY-----
  GITLAB_TOKEN: "glpat-placeholder"
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: orchestrator-repo-pvc
  namespace: hivemind
spec:
  storageClassName: local-path
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 10Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: orchestrator
  namespace: hivemind
  labels:
    app: orchestrator
spec:
  replicas: 1
  selector:
    matchLabels:
      app: orchestrator
  template:
    metadata:
      labels:
        app: orchestrator
    spec:
      serviceAccountName: orchestrator
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
      initContainers:
        - name: repo-init
          image: hivemind/orchestrator:latest
          imagePullPolicy: IfNotPresent
          command: ["python3", "/app/main.py", "init"]
          env:
            - name: ORCHESTRATOR_CONFIG
              value: /app/config/orchestrator_config.json
            - name: AGENT_NAMESPACE
              value: hivemind
          volumeMounts:
            - name: config
              mountPath: /app/config
            - name: repo-storage
              mountPath: /app/workspace/repos
            - name: db-storage
              mountPath: /app/data
            - name: git-ssh-key
              mountPath: /home/hivemind/.ssh
              readOnly: true
      containers:
        - name: orchestrator
          image: hivemind/orchestrator:latest
          imagePullPolicy: IfNotPresent
          command: ["python3", "/app/main.py", "serve"]
          env:
            - name: ORCHESTRATOR_CONFIG
              value: /app/config/orchestrator_config.json
            - name: AGENT_NAMESPACE
              value: hivemind
            - name: AGENT_IMAGE
              value: hivemind-opencode:latest
            - name: GITLAB_TOKEN
              valueFrom:
                secretKeyRef:
                  name: gitlab-agent-credentials
                  key: GITLAB_TOKEN
            - name: GITLAB_HOST
              valueFrom:
                secretKeyRef:
                  name: gitlab-agent-credentials
                  key: GITLAB_HOST
            - name: OPENCODE_MODEL
              valueFrom:
                secretKeyRef:
                  name: gitlab-agent-credentials
                  key: OPENCODE_MODEL
                  optional: true
            - name: OLLAMA_HOST
              valueFrom:
                secretKeyRef:
                  name: gitlab-agent-credentials
                  key: OLLAMA_HOST
                  optional: true
            - name: OLLAMA_BASE_URL
              valueFrom:
                secretKeyRef:
                  name: gitlab-agent-credentials
                  key: OLLAMA_BASE_URL
                  optional: true
            - name: OLLAMA_MODEL
              valueFrom:
                secretKeyRef:
                  name: gitlab-agent-credentials
                  key: OLLAMA_MODEL
                  optional: true
          ports:
            - containerPort: 8080
              name: http
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 30
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          volumeMounts:
            - name: config
              mountPath: /app/config
            - name: repo-storage
              mountPath: /app/workspace/repos
            - name: workspace
              mountPath: /app/workspace
            - name: db-storage
              mountPath: /app/data
            - name: git-ssh-key
              mountPath: /home/hivemind/.ssh
              readOnly: true
      volumes:
        - name: config
          configMap:
            name: orchestrator-config
        - name: repo-storage
          persistentVolumeClaim:
            claimName: orchestrator-repo-pvc
        - name: db-storage
          persistentVolumeClaim:
            claimName: orchestrator-db-pvc
        - name: workspace
          emptyDir: {}
        - name: git-ssh-key
          secret:
            secretName: gitlab-agent-credentials
            defaultMode: 0400
---
# Headless Service fuer Agent-Pod DNS-Aufloesung
# Erlaubt dem Orchestrator, Agent-Pods via DNS zu erreichen:
# agent-worker-{ticket-id}.agent-session.hivemind.svc.cluster.local:4096
apiVersion: v1
kind: Service
metadata:
  name: agent-session
  namespace: hivemind
  labels:
    app.kubernetes.io/name: hivemind
    app.kubernetes.io/component: agent-proxy
spec:
  selector:
    app.kubernetes.io/component: agent
  ports:
    - name: opencode-web
      port: 4096
      targetPort: 4096
  clusterIP: None
---
apiVersion: v1
kind: Service
metadata:
  name: orchestrator
  namespace: hivemind
spec:
  selector:
    app: orchestrator
  ports:
    - name: http
      port: 8080
      targetPort: 8080
---
# Ingress fuer externen Zugriff auf Orchestrator (inkl. Agent-Proxy)
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: hivemind-orchestrator
  namespace: hivemind
  annotations:
    nginx.ingress.kubernetes.io/websocket-services: "orchestrator"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-body-size: "50m"
spec:
  ingressClassName: nginx
  rules:
    - host: hivemind.example.com
      http:
        paths:
          - path: /agent-session
            pathType: Prefix
            backend:
              service:
                name: orchestrator
                port:
                  number: 8080
          - path: /
            pathType: Prefix
            backend:
              service:
                name: orchestrator
                port:
                  number: 8080
