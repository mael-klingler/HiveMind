apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  namespace: hivemind
  labels:
    app: prometheus
data:
  prometheus.yml: |
    global:
      scrape_interval: 10s
      evaluation_interval: 15s

    scrape_configs:
      - job_name: 'hivemind-orchestrator'
        static_configs:
          - targets: ['orchestrator:8080']
        metrics_path: '/metrics'
        scrape_interval: 10s
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: prometheus
  namespace: hivemind
  labels:
    app: prometheus
spec:
  replicas: 1
  selector:
    matchLabels:
      app: prometheus
  template:
    metadata:
      labels:
        app: prometheus
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        fsGroup: 65534
      containers:
        - name: prometheus
          image: prom/prometheus:latest
          ports:
            - containerPort: 9090
              name: http
          args:
            - '--config.file=/etc/prometheus/prometheus.yml'
            - '--storage.tsdb.path=/prometheus'
            - '--storage.tsdb.retention.time=15d'
            - '--web.enable-lifecycle'
          volumeMounts:
            - name: config
              mountPath: /etc/prometheus
            - name: data
              mountPath: /prometheus
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          livenessProbe:
            httpGet:
              path: /-/healthy
              port: http
            initialDelaySeconds: 15
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /-/ready
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
      volumes:
        - name: config
          configMap:
            name: prometheus-config
        - name: data
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: prometheus
  namespace: hivemind
  labels:
    app: prometheus
spec:
  selector:
    app: prometheus
  ports:
    - name: http
      port: 9090
      targetPort: http
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-provisioning-datasources
  namespace: hivemind
  labels:
    app: grafana
data:
  datasources.yaml: |
    apiVersion: 1
    datasources:
      - name: Prometheus
        type: prometheus
        access: proxy
        url: http://prometheus:9090
        isDefault: true
        editable: true
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-provisioning-dashboards
  namespace: hivemind
  labels:
    app: grafana
data:
  dashboards.yaml: |
    apiVersion: 1
    providers:
      - name: HiveMind
        orgId: 1
        folder: ''
        type: file
        disableDeletion: false
        updateIntervalSeconds: 30
        options:
          path: /var/lib/grafana/dashboards
          foldersFromFilesStructure: false
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboard-hivemind
  namespace: hivemind
  labels:
    app: grafana
    grafana_dashboard: "1"
data:
  hivemind-metrics.json: |
    {
      "annotations": { "list": [] },
      "editable": true,
      "fiscalYearStartMonth": 0,
      "graphTooltip": 1,
      "id": null,
      "links": [],
      "panels": [
        {
          "title": "🤖 Agents",
          "type": "stat",
          "gridPos": { "h": 5, "w": 6, "x": 0, "y": 0 },
          "fieldConfig": {
            "defaults": { "thresholds": { "mode": "absolute", "steps": [{ "value": null, "color": "blue" }, { "value": 1, "color": "green" }] }, "mappings": [] },
            "overrides": [
              { "matcher": { "id": "byName", "options": "Idle" }, "properties": [{ "id": "color", "value": { "fixedColor": "super-light-blue", "mode": "fixed" } }] },
              { "matcher": { "id": "byName", "options": "Running" }, "properties": [{ "id": "color", "value": { "fixedColor": "green", "mode": "fixed" } }] },
              { "matcher": { "id": "byName", "options": "Total" }, "properties": [{ "id": "color", "value": { "fixedColor": "purple", "mode": "fixed" } }] }
            ]
          },
          "targets": [
            { "expr": "hivemind_agents_idle", "legendFormat": "Idle", "refId": "A" },
            { "expr": "hivemind_agents_running", "legendFormat": "Running", "refId": "B" },
            { "expr": "hivemind_agents_total", "legendFormat": "Total", "refId": "C" }
          ]
        },
        {
          "title": "📋 Queue",
          "type": "stat",
          "gridPos": { "h": 5, "w": 3, "x": 6, "y": 0 },
          "fieldConfig": { "defaults": { "thresholds": { "mode": "absolute", "steps": [{ "value": null, "color": "green" }, { "value": 5, "color": "yellow" }, { "value": 10, "color": "red" }] } } },
          "targets": [{ "expr": "hivemind_queue_length", "legendFormat": "Queued", "refId": "A" }]
        },
        {
          "title": "✅ Completed",
          "type": "stat",
          "gridPos": { "h": 5, "w": 3, "x": 9, "y": 0 },
          "fieldConfig": { "defaults": { "thresholds": { "mode": "absolute", "steps": [{ "value": null, "color": "text" }, { "value": 1, "color": "green" }] }, "color": { "mode": "thresholds" } } },
          "targets": [{ "expr": "hivemind_tickets_completed_total", "legendFormat": "Completed", "refId": "A" }]
        },
        {
          "title": "❌ Failed",
          "type": "stat",
          "gridPos": { "h": 5, "w": 3, "x": 12, "y": 0 },
          "fieldConfig": { "defaults": { "thresholds": { "mode": "absolute", "steps": [{ "value": null, "color": "green" }, { "value": 1, "color": "red" }] }, "color": { "mode": "thresholds" } } },
          "targets": [{ "expr": "hivemind_tickets_failed_total", "legendFormat": "Failed", "refId": "A" }]
        },
        {
          "title": "🔄 Retries",
          "type": "stat",
          "gridPos": { "h": 5, "w": 3, "x": 15, "y": 0 },
          "fieldConfig": { "defaults": { "thresholds": { "mode": "absolute", "steps": [{ "value": null, "color": "green" }, { "value": 3, "color": "orange" }, { "value": 5, "color": "red" }] } } },
          "targets": [{ "expr": "hivemind_ticket_retries_total", "legendFormat": "Retries", "refId": "A" }]
        },
        {
          "title": "💰 LLM Cost",
          "type": "stat",
          "gridPos": { "h": 5, "w": 3, "x": 18, "y": 0 },
          "fieldConfig": { "defaults": { "unit": "currencyUSD", "decimals": 4, "thresholds": { "mode": "absolute", "steps": [{ "value": null, "color": "green" }, { "value": 1, "color": "yellow" }, { "value": 10, "color": "red" }] } } },
          "targets": [{ "expr": "hivemind_llm_cost_usd_total", "legendFormat": "Total", "refId": "A" }]
        },
        {
          "title": "🧠 Tokens",
          "type": "stat",
          "gridPos": { "h": 5, "w": 3, "x": 21, "y": 0 },
          "fieldConfig": { "defaults": { "unit": "short", "thresholds": { "mode": "absolute", "steps": [{ "value": null, "color": "blue" }] } } },
          "targets": [
            { "expr": "hivemind_llm_prompt_tokens_total", "legendFormat": "Prompt", "refId": "A" },
            { "expr": "hivemind_llm_completion_tokens_total", "legendFormat": "Completion", "refId": "B" }
          ]
        },
        {
          "title": "Tickets by Status",
          "type": "piechart",
          "gridPos": { "h": 8, "w": 6, "x": 0, "y": 5 },
          "fieldConfig": { "defaults": { "color": { "mode": "palette-classic" } } },
          "options": { "displayLabels": ["percent", "name"], "pieType": "donut", "reduceOptions": { "calcs": ["lastNotNull"] } },
          "targets": [{ "expr": "hivemind_tickets", "legendFormat": "{{status}}", "refId": "A" }]
        },
        {
          "title": "Ticket Lifecycle (rate)",
          "type": "timeseries",
          "gridPos": { "h": 8, "w": 9, "x": 6, "y": 5 },
          "fieldConfig": { "defaults": { "custom": { "fillOpacity": 20, "lineWidth": 2 }, "unit": "ops" } },
          "targets": [
            { "expr": "rate(hivemind_tickets_created_total[5m])", "legendFormat": "Created", "refId": "A" },
            { "expr": "rate(hivemind_tickets_completed_total[5m])", "legendFormat": "Completed", "refId": "B" },
            { "expr": "rate(hivemind_tickets_failed_total[5m])", "legendFormat": "Failed", "refId": "C" },
            { "expr": "rate(hivemind_tickets_merged_total[5m])", "legendFormat": "Merged", "refId": "D" },
            { "expr": "rate(hivemind_tickets_recovered_total[5m])", "legendFormat": "Recovered", "refId": "E" }
          ]
        },
        {
          "title": "Tickets per Status (trend)",
          "type": "timeseries",
          "gridPos": { "h": 8, "w": 9, "x": 15, "y": 5 },
          "fieldConfig": { "defaults": { "custom": { "fillOpacity": 15, "lineWidth": 2 } } },
          "targets": [{ "expr": "hivemind_tickets", "legendFormat": "{{status}}", "refId": "A" }]
        },
        {
          "title": "⏱ Ticket Duration",
          "type": "timeseries",
          "gridPos": { "h": 8, "w": 8, "x": 0, "y": 13 },
          "fieldConfig": { "defaults": { "unit": "s", "custom": { "lineWidth": 2, "fillOpacity": 15 } } },
          "targets": [
            { "expr": "hivemind_ticket_duration_seconds{quantile=\"0.5\"}", "legendFormat": "p50 {{status}}", "refId": "A" },
            { "expr": "hivemind_ticket_duration_seconds{quantile=\"0.9\"}", "legendFormat": "p90 {{status}}", "refId": "B" },
            { "expr": "hivemind_ticket_duration_seconds{quantile=\"0.99\"}", "legendFormat": "p99 {{status}}", "refId": "C" }
          ]
        },
        {
          "title": "🧠 LLM Token Usage",
          "type": "timeseries",
          "gridPos": { "h": 8, "w": 8, "x": 8, "y": 13 },
          "fieldConfig": { "defaults": { "custom": { "lineWidth": 2, "fillOpacity": 15 }, "unit": "short" } },
          "targets": [
            { "expr": "rate(hivemind_llm_prompt_tokens_total[5m])", "legendFormat": "Prompt tokens/s", "refId": "A" },
            { "expr": "rate(hivemind_llm_completion_tokens_total[5m])", "legendFormat": "Completion tokens/s", "refId": "B" }
          ]
        },
        {
          "title": "📊 Code Changes (cumulative)",
          "type": "timeseries",
          "gridPos": { "h": 8, "w": 8, "x": 16, "y": 13 },
          "fieldConfig": { "defaults": { "custom": { "lineWidth": 2 }, "unit": "short" } },
          "targets": [
            { "expr": "hivemind_lines_added_total", "legendFormat": "Lines added", "refId": "A" },
            { "expr": "hivemind_lines_removed_total", "legendFormat": "Lines removed", "refId": "B" },
            { "expr": "hivemind_files_changed_total", "legendFormat": "Files changed", "refId": "C" }
          ]
        },
        {
          "title": "⏳ Ticket Age (active)",
          "type": "timeseries",
          "gridPos": { "h": 8, "w": 8, "x": 0, "y": 21 },
          "fieldConfig": { "defaults": { "unit": "s", "custom": { "lineWidth": 2 } } },
          "targets": [
            { "expr": "hivemind_ticket_age_seconds{quantile=\"0.5\"}", "legendFormat": "p50 {{status}}", "refId": "A" },
            { "expr": "hivemind_ticket_age_seconds{quantile=\"0.9\"}", "legendFormat": "p90 {{status}}", "refId": "B" }
          ]
        },
        {
          "title": "🔄 Retries & Recovery",
          "type": "timeseries",
          "gridPos": { "h": 8, "w": 8, "x": 8, "y": 21 },
          "fieldConfig": { "defaults": { "custom": { "lineWidth": 2 }, "unit": "short" } },
          "targets": [
            { "expr": "rate(hivemind_ticket_retries_total[5m])", "legendFormat": "Retries", "refId": "A" },
            { "expr": "rate(hivemind_tickets_recovered_total[5m])", "legendFormat": "Recovered", "refId": "B" },
            { "expr": "rate(hivemind_review_cycles_total[5m])", "legendFormat": "Review cycles", "refId": "C" }
          ]
        },
        {
          "title": "🌐 Proxy Requests",
          "type": "timeseries",
          "gridPos": { "h": 8, "w": 8, "x": 16, "y": 21 },
          "fieldConfig": { "defaults": { "custom": { "lineWidth": 2 }, "unit": "reqps" } },
          "targets": [
            { "expr": "rate(hivemind_proxy_requests_total[5m])", "legendFormat": "{{method}}", "refId": "A" }
          ]
        }
      ],
      "refresh": "10s",
      "schemaVersion": 39,
      "tags": ["hivemind", "agents"],
      "templating": { "list": [] },
      "time": { "from": "now-1h", "to": "now" },
      "title": "HiveMind Overview",
      "uid": "hivemind-agent-metrics",
      "version": 3
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: grafana
  namespace: hivemind
  labels:
    app: grafana
spec:
  replicas: 1
  selector:
    matchLabels:
      app: grafana
  template:
    metadata:
      labels:
        app: grafana
    spec:
      securityContext:
        fsGroup: 472
      containers:
        - name: grafana
          image: grafana/grafana:latest
          ports:
            - containerPort: 3000
              name: http
          env:
            - name: GF_SECURITY_ADMIN_USER
              value: admin
            - name: GF_SECURITY_ADMIN_PASSWORD
              value: hivemind
            - name: GF_AUTH_ANONYMOUS_ENABLED
              value: "true"
            - name: GF_AUTH_ANONYMOUS_ORG_ROLE
              value: Viewer
            - name: GF_PLUGINS_PREINSTALL
              value: ""
            - name: GF_PLUGIN_UPGRADE_CHECK_ENABLED
              value: "false"
          volumeMounts:
            - name: datasources
              mountPath: /etc/grafana/provisioning/datasources
            - name: dashboard-providers
              mountPath: /etc/grafana/provisioning/dashboards
            - name: dashboards
              mountPath: /var/lib/grafana/dashboards
            - name: data
              mountPath: /var/lib/grafana
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
          livenessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 30
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
      volumes:
        - name: datasources
          configMap:
            name: grafana-provisioning-datasources
        - name: dashboard-providers
          configMap:
            name: grafana-provisioning-dashboards
        - name: dashboards
          configMap:
            name: grafana-dashboard-hivemind
        - name: data
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: grafana
  namespace: hivemind
  labels:
    app: grafana
spec:
  selector:
    app: grafana
  ports:
    - name: http
      port: 3000
      targetPort: http