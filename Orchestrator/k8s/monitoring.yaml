apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  namespace: hivemind
  labels:
    app: prometheus
data:
  prometheus.yml: |
    global:
      scrape_interval: 10s
      evaluation_interval: 15s

    scrape_configs:
      - job_name: 'hivemind-orchestrator'
        static_configs:
          - targets: ['orchestrator:8080']
        metrics_path: '/metrics'
        scrape_interval: 10s
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: prometheus
  namespace: hivemind
  labels:
    app: prometheus
spec:
  replicas: 1
  selector:
    matchLabels:
      app: prometheus
  template:
    metadata:
      labels:
        app: prometheus
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        fsGroup: 65534
      containers:
        - name: prometheus
          image: prom/prometheus:latest
          ports:
            - containerPort: 9090
              name: http
          args:
            - '--config.file=/etc/prometheus/prometheus.yml'
            - '--storage.tsdb.path=/prometheus'
            - '--storage.tsdb.retention.time=15d'
            - '--web.enable-lifecycle'
          volumeMounts:
            - name: config
              mountPath: /etc/prometheus
            - name: data
              mountPath: /prometheus
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          livenessProbe:
            httpGet:
              path: /-/healthy
              port: http
            initialDelaySeconds: 15
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /-/ready
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
      volumes:
        - name: config
          configMap:
            name: prometheus-config
        - name: data
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: prometheus
  namespace: hivemind
  labels:
    app: prometheus
spec:
  selector:
    app: prometheus
  ports:
    - name: http
      port: 9090
      targetPort: http
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-provisioning-datasources
  namespace: hivemind
  labels:
    app: grafana
data:
  datasources.yaml: |
    apiVersion: 1
    datasources:
      - name: Prometheus
        type: prometheus
        access: proxy
        url: http://prometheus:9090
        isDefault: true
        editable: true
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-provisioning-dashboards
  namespace: hivemind
  labels:
    app: grafana
data:
  dashboards.yaml: |
    apiVersion: 1
    providers:
      - name: HiveMind
        orgId: 1
        folder: ''
        type: file
        disableDeletion: false
        updateIntervalSeconds: 30
        options:
          path: /var/lib/grafana/dashboards
          foldersFromFilesStructure: false
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboard-hivemind
  namespace: hivemind
  labels:
    app: grafana
    grafana_dashboard: "1"
data:
  hivemind-metrics.json: |
    {
      "annotations": { "list": [] },
      "editable": true,
      "fiscalYearStartMonth": 0,
      "graphTooltip": 1,
      "id": null,
      "links": [],
      "panels": [
        {
          "title": "Agents",
          "type": "stat",
          "gridPos": { "h": 4, "w": 4, "x": 0, "y": 0 },
          "fieldConfig": { "defaults": { "mappings": [] } },
          "targets": [
            { "expr": "hivemind_agents_idle", "legendFormat": "Idle", "refId": "A" },
            { "expr": "hivemind_agents_running", "legendFormat": "Running", "refId": "B" },
            { "expr": "hivemind_agents_total", "legendFormat": "Total", "refId": "C" }
          ]
        },
        {
          "title": "Queue Depth",
          "type": "stat",
          "gridPos": { "h": 4, "w": 4, "x": 4, "y": 0 },
          "targets": [{ "expr": "hivemind_queue_length", "legendFormat": "Queued", "refId": "A" }]
        },
        {
          "title": "Tickets by Status",
          "type": "barchart",
          "gridPos": { "h": 4, "w": 8, "x": 8, "y": 0 },
          "targets": [{ "expr": "hivemind_tickets", "legendFormat": "{{status}}", "refId": "A" }],
          "options": { "orientation": "horizontal" }
        },
        {
          "title": "Lines Changed (cumulative)",
          "type": "stat",
          "gridPos": { "h": 4, "w": 4, "x": 16, "y": 0 },
          "fieldConfig": { "defaults": { "color": { "mode": "thresholds" }, "thresholds": { "mode": "absolute", "steps": [{ "value": null, "color": "green" }, { "value": 1000, "color": "yellow" }, { "value": 5000, "color": "orange" }] } } },
          "targets": [
            { "expr": "hivemind_lines_added_total", "legendFormat": "Added", "refId": "A" },
            { "expr": "hivemind_lines_removed_total", "legendFormat": "Removed", "refId": "B" },
            { "expr": "hivemind_files_changed_total", "legendFormat": "Files", "refId": "C" }
          ]
        },
        {
          "title": "LLM Tokens (cumulative)",
          "type": "stat",
          "gridPos": { "h": 4, "w": 4, "x": 20, "y": 0 },
          "targets": [
            { "expr": "hivemind_llm_prompt_tokens_total", "legendFormat": "Prompt", "refId": "A" },
            { "expr": "hivemind_llm_completion_tokens_total", "legendFormat": "Completion", "refId": "B" }
          ]
        },
        {
          "title": "Ticket Duration (seconds)",
          "type": "timeseries",
          "gridPos": { "h": 9, "w": 8, "x": 0, "y": 4 },
          "fieldConfig": { "defaults": { "unit": "s" } },
          "targets": [
            { "expr": "hivemind_ticket_duration_seconds", "legendFormat": "{{status}}", "refId": "A" }
          ]
        },
        {
          "title": "Ticket Lifecycle Events (rate)",
          "type": "timeseries",
          "gridPos": { "h": 9, "w": 8, "x": 8, "y": 4 },
          "targets": [
            { "expr": "rate(hivemind_tickets_created_total[5m])", "legendFormat": "Created", "refId": "A" },
            { "expr": "rate(hivemind_tickets_completed_total[5m])", "legendFormat": "Completed", "refId": "B" },
            { "expr": "rate(hivemind_tickets_failed_total[5m])", "legendFormat": "Failed", "refId": "C" },
            { "expr": "rate(hivemind_tickets_recovered_total[5m])", "legendFormat": "Recovered", "refId": "D" }
          ]
        },
        {
          "title": "LLM Cost (USD total)",
          "type": "stat",
          "gridPos": { "h": 9, "w": 4, "x": 16, "y": 4 },
          "fieldConfig": { "defaults": { "unit": "currencyUSD", "decimals": 2 } },
          "targets": [{ "expr": "hivemind_llm_cost_usd_total", "legendFormat": "Total Cost", "refId": "A" }]
        },
        {
          "title": "Tickets per Status (trend)",
          "type": "timeseries",
          "gridPos": { "h": 9, "w": 4, "x": 20, "y": 4 },
          "targets": [{ "expr": "hivemind_tickets", "legendFormat": "{{status}}", "refId": "A" }]
        },
        {
          "title": "Lines Added per Ticket",
          "type": "timeseries",
          "gridPos": { "h": 9, "w": 8, "x": 0, "y": 13 },
          "fieldConfig": { "defaults": {} },
          "targets": [
            { "expr": "hivemind_ticket_lines_added", "legendFormat": "Added", "refId": "A" },
            { "expr": "hivemind_ticket_lines_removed", "legendFormat": "Removed", "refId": "B" }
          ]
        },
        {
          "title": "Files Changed per Ticket",
          "type": "timeseries",
          "gridPos": { "h": 9, "w": 8, "x": 8, "y": 13 },
          "targets": [
            { "expr": "hivemind_ticket_files_changed", "legendFormat": "Files", "refId": "A" }
          ]
        },
        {
          "title": "LLM Token Usage (rate)",
          "type": "timeseries",
          "gridPos": { "h": 9, "w": 8, "x": 16, "y": 13 },
          "targets": [
            { "expr": "rate(hivemind_llm_prompt_tokens_total[5m])", "legendFormat": "Prompt tokens/s", "refId": "A" },
            { "expr": "rate(hivemind_llm_completion_tokens_total[5m])", "legendFormat": "Completion tokens/s", "refId": "B" }
          ]
        },
        {
          "title": "Ticket Age (active tickets)",
          "type": "timeseries",
          "gridPos": { "h": 8, "w": 8, "x": 0, "y": 22 },
          "fieldConfig": { "defaults": { "unit": "s" } },
          "targets": [
            { "expr": "hivemind_ticket_age_seconds", "legendFormat": "{{status}}", "refId": "A" }
          ]
        },
        {
          "title": "Retry & Recovery (rate)",
          "type": "timeseries",
          "gridPos": { "h": 8, "w": 8, "x": 8, "y": 22 },
          "targets": [
            { "expr": "rate(hivemind_ticket_retries_total[5m])", "legendFormat": "Retries", "refId": "A" },
            { "expr": "rate(hivemind_tickets_recovered_total[5m])", "legendFormat": "Recovered", "refId": "B" }
          ]
        },
        {
          "title": "Proxy Requests",
          "type": "timeseries",
          "gridPos": { "h": 8, "w": 8, "x": 16, "y": 22 },
          "targets": [
            { "expr": "rate(hivemind_proxy_requests_total[5m])", "legendFormat": "{{method}}", "refId": "A" }
          ]
        }
      ],
      "refresh": "10s",
      "schemaVersion": 39,
      "tags": ["hivemind", "agents"],
      "templating": { "list": [] },
      "time": { "from": "now-1h", "to": "now" },
      "title": "HiveMind Agent Metrics",
      "uid": "hivemind-agent-metrics",
      "version": 2
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: grafana
  namespace: hivemind
  labels:
    app: grafana
spec:
  replicas: 1
  selector:
    matchLabels:
      app: grafana
  template:
    metadata:
      labels:
        app: grafana
    spec:
      securityContext:
        fsGroup: 472
      containers:
        - name: grafana
          image: grafana/grafana:latest
          ports:
            - containerPort: 3000
              name: http
          env:
            - name: GF_SECURITY_ADMIN_USER
              value: admin
            - name: GF_SECURITY_ADMIN_PASSWORD
              value: hivemind
            - name: GF_AUTH_ANONYMOUS_ENABLED
              value: "true"
            - name: GF_AUTH_ANONYMOUS_ORG_ROLE
              value: Viewer
            - name: GF_PLUGINS_PREINSTALL
              value: ""
            - name: GF_PLUGIN_UPGRADE_CHECK_ENABLED
              value: "false"
          volumeMounts:
            - name: datasources
              mountPath: /etc/grafana/provisioning/datasources
            - name: dashboard-providers
              mountPath: /etc/grafana/provisioning/dashboards
            - name: dashboards
              mountPath: /var/lib/grafana/dashboards
            - name: data
              mountPath: /var/lib/grafana
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
          livenessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 30
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
      volumes:
        - name: datasources
          configMap:
            name: grafana-provisioning-datasources
        - name: dashboard-providers
          configMap:
            name: grafana-provisioning-dashboards
        - name: dashboards
          configMap:
            name: grafana-dashboard-hivemind
        - name: data
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: grafana
  namespace: hivemind
  labels:
    app: grafana
spec:
  selector:
    app: grafana
  ports:
    - name: http
      port: 3000
      targetPort: http