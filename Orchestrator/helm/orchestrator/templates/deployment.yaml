apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "orchestrator.fullname" . }}
  labels:
    {{- include "orchestrator.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "orchestrator.labels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "orchestrator.labels" . | nindent 8 }}
    spec:
      {{- if .Values.rbac.create }}
      serviceAccountName: {{ include "orchestrator.fullname" . }}
      {{- end }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
      initContainers:
        - name: repo-init
          image: {{ .Values.image.repository }}:{{ .Values.image.tag }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["python3", "/app/main.py", "init"]
          env:
            - name: ORCHESTRATOR_CONFIG
              value: /app/config/orchestrator_config.json
            - name: GIT_HOST
              value: "{{ .Values.git.host }}"
            - name: GIT_USER
              value: "gitlab-ci-token"
            - name: GIT_TOKEN
              value: "{{ .Values.git.token }}"
            - name: OLLAMA_HOST
              value: {{ .Values.config.ollama_host }}
            - name: OLLAMA_MODEL
              value: {{ .Values.config.ollama_model }}
            - name: OPENCODE_MODEL
              value: {{ .Values.config.opencode_model }}
            - name: OLLAMA_CLOUD_API_KEY
              value: "{{ .Values.ollamaCloud.apiKey }}"
            - name: TRACK_BRANCH
              value: "development"
            - name: GITLAB_HOST
              value: "{{ .Values.git.host }}"
            - name: GITLAB_TOKEN
              value: "{{ .Values.git.token }}"
            - name: GITHUB_TOKEN
              value: "{{ .Values.github.token }}"
            - name: GITHUB_HOST
              value: "{{ .Values.github.host }}"
            - name: VCS_PROVIDER
              value: "{{ .Values.vcsProvider }}"
            - name: HIVEMIND_API_KEY
              value: "{{ .Values.hivemindApiKey }}"
            - name: MODEL_ROUTING_ENABLED
              value: "{{ .Values.modelRouting.enabled }}"
            - name: SIMPLE_MODEL
              value: "{{ .Values.modelRouting.simpleModel }}"
            - name: COMPLEX_MODEL
              value: "{{ .Values.modelRouting.complexModel }}"
            - name: RATE_LIMIT_PER_MINUTE
              value: "{{ .Values.rateLimit.perMinute }}"
            - name: AGENT_RETRY_DELAY
              value: "{{ .Values.agent.retryDelay }}"
            - name: AGENT_MAX_RETRIES
              value: "{{ .Values.agent.maxRetries }}"
            - name: AGENT_STALE_TIMEOUT
              value: "{{ .Values.agent.staleTimeout }}"
            - name: TEST_COMMAND
              value: "{{ .Values.agent.testCommand }}"
            - name: DATABASE_URL
              value: "{{ .Values.config.database_url }}"
          volumeMounts:
            - name: config
              mountPath: /app/config
            - name: repo-storage
              mountPath: {{ .Values.config.pvc_mount_path }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
    containers:
      - name: orchestrator
        image: {{ .Values.image.repository }}:{{ .Values.image.tag }}
        imagePullPolicy: {{ .Values.image.pullPolicy }}
        command: ["python3", "/app/main.py", "serve"]
        env:
          - name: ORCHESTRATOR_CONFIG
            value: /app/config/orchestrator_config.json
          - name: GIT_HOST
            value: "{{ .Values.git.host }}"
            - name: GIT_USER
              value: "gitlab-ci-token"
            - name: GIT_TOKEN
              value: "{{ .Values.git.token }}"
            - name: OLLAMA_HOST
              value: {{ .Values.config.ollama_host }}
            - name: OLLAMA_MODEL
              value: {{ .Values.config.ollama_model }}
            - name: OPENCODE_MODEL
              value: {{ .Values.config.opencode_model }}
            - name: OLLAMA_CLOUD_API_KEY
              value: "{{ .Values.ollamaCloud.apiKey }}"
            - name: TRACK_BRANCH
              value: "main"
            - name: GITLAB_HOST
              value: "{{ .Values.git.host }}"
            - name: GITLAB_TOKEN
              value: "{{ .Values.git.token }}"
            - name: GITHUB_TOKEN
              value: "{{ .Values.github.token }}"
            - name: GITHUB_HOST
              value: "{{ .Values.github.host }}"
            - name: VCS_PROVIDER
              value: "{{ .Values.vcsProvider }}"
            - name: HIVEMIND_API_KEY
              value: "{{ .Values.hivemindApiKey }}"
            - name: MODEL_ROUTING_ENABLED
              value: "{{ .Values.modelRouting.enabled }}"
            - name: SIMPLE_MODEL
              value: "{{ .Values.modelRouting.simpleModel }}"
            - name: COMPLEX_MODEL
              value: "{{ .Values.modelRouting.complexModel }}"
            - name: RATE_LIMIT_PER_MINUTE
              value: "{{ .Values.rateLimit.perMinute }}"
            - name: AGENT_RETRY_DELAY
              value: "{{ .Values.agent.retryDelay }}"
            - name: AGENT_MAX_RETRIES
              value: "{{ .Values.agent.maxRetries }}"
            - name: AGENT_STALE_TIMEOUT
              value: "{{ .Values.agent.staleTimeout }}"
            - name: TEST_COMMAND
              value: "{{ .Values.agent.testCommand }}"
            - name: DATABASE_URL
              value: "{{ .Values.config.database_url }}"
          volumeMounts:
            - name: workspace
              mountPath: {{ .Values.config.work_dir }}
            - name: config
              mountPath: /app/config
              readOnly: true
            - name: repo-storage
              mountPath: {{ .Values.config.pvc_mount_path }}
          ports:
            - containerPort: {{ .Values.service.port }}
              name: http
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
      volumes:
        - name: config
          configMap:
            name: {{ include "orchestrator.fullname" . }}-config
        - name: repo-storage
          {{- if .Values.persistence.enabled }}
          persistentVolumeClaim:
            claimName: {{ include "orchestrator.fullname" . }}-repo-pvc
          {{- else }}
          emptyDir: {}
          {{- end }}
        - name: workspace
          emptyDir: {}
