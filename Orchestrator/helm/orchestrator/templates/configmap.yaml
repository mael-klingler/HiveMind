{{- $config := .Values.config -}}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "orchestrator.fullname" . }}-config
  labels:
    {{- include "orchestrator.labels" . | nindent 4 }}
data:
  orchestrator_config.json: |
    {
      "work_dir": "{{ $config.work_dir }}",
      "pvc_mount_path": "{{ $config.pvc_mount_path }}",
      "track_branch": "{{ $config.track_branch }}",
      "auto_pull_interval_minutes": {{ $config.auto_pull_interval_minutes }},
      "leankg_enabled": {{ $config.leankg_enabled | default true }},
      "ollama_host": "{{ $config.ollama_host }}",
      "ollama_model": "{{ $config.ollama_model }}",
      "opencode_model": "{{ $config.opencode_model }}",
      "log_level": "{{ $config.log_level }}",
      "repositories": [
        {{- range $i, $repo := $config.repositories }}
        {{- if $i }},{{ end }}
        {
          "name": "{{ $repo.name }}",
          "url": "{{ $repo.url }}",
          "branch": "{{ $repo.branch | default "main" }}",
          "description": "{{ $repo.description }}",
          "tags": [{{ range $j, $tag := $repo.tags }}{{ if $j }}, {{ end }}"{{ $tag }}"{{ end }}]
        }{{ end }}
      ]
    }
