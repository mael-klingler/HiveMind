# HiveMind Orchestrator Helm Chart – Values

image:
  repository: hivemind/orchestrator
  pullPolicy: Always
  tag: "latest"

replicaCount: 1

git:
  host: ""
  token: ""

github:
  token: ""
  host: "github.com"

vcsProvider: "gitlab"

envFromSecret:
  enabled: true
  name: "orchestrator-env"

envFromConfigMap:
  enabled: false
  name: ""

ollamaCloud:
  apiKey: ""

hivemindApiKey: ""

modelRouting:
  enabled: false
  simpleModel: ""
  complexModel: ""

rateLimit:
  perMinute: 60

agent:
  retryDelay: 30
  maxRetries: 3
  staleTimeout: 3600
  testCommand: ""

config:
  work_dir: "/app/workspace"
  pvc_mount_path: "/app/workspace/repos"
  track_branch: "main"
  auto_pull_interval_minutes: 60
  leankg_enabled: true
  ollama_host: ""
  ollama_model: ""
  opencode_model: ""
  ollama_timeout: 120
  log_level: "INFO"
  database_url: ""

persistence:
  enabled: true
  storageClassName: "standard"
  accessMode: ReadWriteOnce
  size: 10Gi

resources:
  requests:
    memory: "512Mi"
    cpu: "250m"
  limits:
    memory: "2Gi"
    cpu: "1000m"

service:
  type: ClusterIP
  port: 8080

ingress:
  enabled: false
  className: nginx
  annotations: {}
  hosts:
    - host: hivemind.local
      paths:
        - path: /
          pathType: Prefix
  tls:
    enabled: false
    certManager:
      enabled: false
      issuerName: letsencrypt-staging
      issuerKind: ClusterIssuer
    existingSecret: ""

securityContext:
  runAsNonRoot: true
  runAsUser: 1000
  runAsGroup: 1000
  fsGroup: 1000

rbac:
  create: true

agentNamespace: hivemind

networkPolicy:
  enabled: true

postgresql:
  enabled: false
  host: ""
  port: 5432
  database: hivemind
  username: hivemind
  password: ""
  existingSecret: ""
  existingSecretKey: ""

database:
  persistence:
    enabled: true
    size: 1Gi
    storageClassName: local-path

resourceQuota:
  enabled: true
  hard:
    requests.cpu: "8"
    requests.memory: 32Gi
    pods: "20"