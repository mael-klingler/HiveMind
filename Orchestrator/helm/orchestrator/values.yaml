# HiveMind Orchestrator Helm Chart – Values (CaptureCore Cluster)

image:
  repository: reg.capturecore.org/capturecore/hivemind-orchestrator
  pullPolicy: Always
  pullSecrets:
    - name: harbor-registry-secret
  tag: "latest"

replicaCount: 1

git:
  host: "gitlab.capturecore.org"
  token: ""

github:
  token: ""
  host: "github.com"

vcsProvider: "gitlab"

envFromSecret:
  enabled: true
  name: "orchestrator-env"

envFromConfigMap:
  enabled: false
  name: ""

ollamaCloud:
  apiKey: ""

hivemindApiKey: ""

modelRouting:
  enabled: false
  simpleModel: ""
  complexModel: ""

rateLimit:
  perMinute: 60

agent:
  retryDelay: 30
  maxRetries: 3
  staleTimeout: 3600
  testCommand: ""

config:
  work_dir: "/app/workspace"
  pvc_mount_path: "/app/workspace/repos"
  track_branch: "main"
  auto_pull_interval_minutes: 60
  leankg_enabled: true
  ollama_host: "http://ollama.kagent.svc.cluster.local:11434"
  ollama_model: "llama3.2"
  opencode_model: "llama3.2"
  ollama_timeout: 300
  log_level: "INFO"
  database_url: ""

persistence:
  enabled: true
  storageClassName: "longhorn-fast"
  accessMode: ReadWriteOnce
  size: 10Gi

resources:
  requests:
    memory: "512Mi"
    cpu: "250m"
  limits:
    memory: "2Gi"
    cpu: "1000m"

service:
  type: ClusterIP
  port: 8080

ingress:
  enabled: true
  className: nginx
  annotations:
    nginx.ingress.kubernetes.io/websocket-services: "orchestrator"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-body-size: "50m"
    cert-manager.io/issuer: capturecore-ca
    cert-manager.io/issuer-kind: ClusterIssuer
  hosts:
    - host: hivemind.capturecore.org
      paths:
        - path: /
          pathType: Prefix
        - path: /agent-session
          pathType: Prefix
  tls:
    enabled: true
    certManager:
      enabled: true
      issuerName: capturecore-ca
      issuerKind: ClusterIssuer
    existingSecret: ""

securityContext:
  runAsNonRoot: true
  runAsUser: 1000
  runAsGroup: 1000
  fsGroup: 1000

rbac:
  create: true

agentNamespace: hivemind

networkPolicy:
  enabled: true

postgresql:
  enabled: false
  host: ""
  port: 5432
  database: hivemind
  username: hivemind
  password: ""
  existingSecret: ""
  existingSecretKey: ""

database:
  persistence:
    enabled: true
    size: 1Gi
    storageClassName: longhorn-fast

resourceQuota:
  enabled: true
  hard:
    requests.cpu: "16"
    requests.memory: 64Gi
    pods: "30"