# HiveMind Supabase Configuration
# ================================
# This config is used by the Supabase CLI for local development and deployments.
# See: https://supabase.com/docs/guides/self-hosting

[api]
enabled = true
port = 54321
schemas = ["public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322

[studio]
enabled = true
port = 54323

[auth]
enabled = true
site_url = "http://localhost:3000"
additional_redirect_urls = []
jwt_expiry = 3600
enable_signup = true
email_enable_signup = true
email_double_confirm_changes = true

[auth.email]
enable_signup = true
double_confirm_changes = true

[auth.external]
enabled = false

[realtime]
enabled = true

[storage]
enabled = false

[edge_runtime]
enabled = true

[functions.rate-limit]
verify_jwt = false

[functions.webhook-validate]
verify_jwt = false