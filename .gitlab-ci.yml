stages:
  - test
  - build
  - deploy

variables:
  REGISTRY: reg.capturecore.org
  IMAGE_PREFIX: hivemind
  ORCHESTRATOR_IMAGE: ${REGISTRY}/${IMAGE_PREFIX}/hivemind-orchestrator
  AGENT_IMAGE: ${REGISTRY}/${IMAGE_PREFIX}/hivemind-opencode
  DOCKER_TLS_CERTDIR: ""
  DOCKER_HOST: tcp://docker:2375
  DOCKER_DRIVER: overlay2

test:orchestrator:
  stage: test
  image: python:3.11-slim
  before_script:
    - cd Orchestrator
    - pip install --no-cache-dir -r requirements.txt pytest pytest-asyncio httpx
  script:
    - cd tests && pytest -v --tb=short || true
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH == "main"'
    - if: '$CI_COMMIT_BRANCH == "development"'

build:orchestrator:
  stage: build
  image: docker:27-dind
  services:
    - name: docker:27-dind
      command: ["--tls=false", "--insecure-registry=reg.capturecore.org"]
      alias: docker
  variables:
    DOCKER_HOST: tcp://docker:2375
    DOCKER_TLS_CERTDIR: ""
    DOCKER_DRIVER: overlay2
  before_script:
    - echo "${HARBOR_ROBOT_TOKEN}" | docker login ${REGISTRY} -u 'robot$hivemind+hivemind-ci' --password-stdin
  script:
    - ORCHESTRATOR_TAG="${CI_COMMIT_SHORT_SHA}"
    - |
      if [ "$CI_COMMIT_BRANCH" = "main" ]; then
        ORCHESTRATOR_TAG="latest"
      fi
    - docker build
        --build-arg BUILDKIT_INLINE_CACHE=1
        -t ${ORCHESTRATOR_IMAGE}:${ORCHESTRATOR_TAG}
        -t ${ORCHESTRATOR_IMAGE}:${CI_COMMIT_SHORT_SHA}
        -f Orchestrator/Dockerfile Orchestrator/
    - docker push ${ORCHESTRATOR_IMAGE}:${ORCHESTRATOR_TAG}
    - docker push ${ORCHESTRATOR_IMAGE}:${CI_COMMIT_SHORT_SHA}
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
    - if: '$CI_COMMIT_BRANCH == "development"'

build:agent:
  stage: build
  image: docker:27-dind
  services:
    - name: docker:27-dind
      command: ["--tls=false", "--insecure-registry=reg.capturecore.org"]
      alias: docker
  variables:
    DOCKER_HOST: tcp://docker:2375
    DOCKER_TLS_CERTDIR: ""
    DOCKER_DRIVER: overlay2
  before_script:
    - echo "${HARBOR_ROBOT_TOKEN}" | docker login ${REGISTRY} -u 'robot$hivemind+hivemind-ci' --password-stdin
  script:
    - AGENT_TAG="${CI_COMMIT_SHORT_SHA}"
    - |
      if [ "$CI_COMMIT_BRANCH" = "main" ]; then
        AGENT_TAG="latest"
      fi
    - docker build
        --build-arg BUILDKIT_INLINE_CACHE=1
        -t ${AGENT_IMAGE}:${AGENT_TAG}
        -t ${AGENT_IMAGE}:${CI_COMMIT_SHORT_SHA}
        -f Agent/Dockerfile Agent/
    - docker push ${AGENT_IMAGE}:${AGENT_TAG}
    - docker push ${AGENT_IMAGE}:${CI_COMMIT_SHORT_SHA}
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
    - if: '$CI_COMMIT_BRANCH == "development"'

deploy:update-manifests:
  stage: deploy
  image: alpine/git:latest
  variables:
    GIT_SSL_NO_VERIFY: "1"
  script:
    - CLONE_URL="https://argocd-deploy:${DEPLOY_REPO_TOKEN}@gitlab.capturecore.org/ai/hivemind-deploy.git"
    - git clone "$CLONE_URL" /tmp/hivemind-deploy
    - "sed -i 's/newTag:.*/newTag: latest/' /tmp/hivemind-deploy/orchestrator/base/kustomization.yaml"
    - cd /tmp/hivemind-deploy
    - git config user.name "GitLab CI"
    - git config user.email "ci@gitlab.capturecore.org"
    - git add -A
    - COMMIT_MSG="auto-update image tags to latest"
    - git diff --cached --quiet || git commit -m "$COMMIT_MSG"
    - git push origin HEAD:main
  environment:
    name: production
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
      when: manual