stages:
  - test
  - build
  - release
  - deploy

variables:
  REGISTRY: reg.capturecore.org
  IMAGE_PREFIX: hivemind
  ORCHESTRATOR_IMAGE: ${REGISTRY}/${IMAGE_PREFIX}/hivemind-orchestrator
  AGENT_IMAGE: ${REGISTRY}/${IMAGE_PREFIX}/hivemind-opencode

# ─── Test ───────────────────────────────────────────────────────

test:orchestrator:
  stage: test
  image: golang:1.23-alpine
  before_script:
    - apk add --no-cache git gcc musl-dev curl bash
    - curl -fsSL https://just.systems/install.sh | bash -s -- --to /usr/local/bin
    - just --version
    - go mod download
  script:
    - just ci-go
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH == "main"'
    - if: '$CI_COMMIT_BRANCH == "development"'
    - if: '$CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+$/'

# ─── Build (Kaniko — no privileged Docker daemon) ───────────────

.build:template: &build_template
  stage: build
  image:
    name: gcr.io/kaniko-project/executor:v1.23.2-debug
    entrypoint: [""]
  before_script:
    - mkdir -p /kaniko/.docker
    - |
      cat > /kaniko/.docker/config.json << EOF
      {
        "auths": {
          "${REGISTRY}": {
            "username": "${HARBOR_ROBOT_USER}",
            "password": "${HARBOR_ROBOT_TOKEN}"
          }
        }
      }
      EOF
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
    - if: '$CI_COMMIT_BRANCH == "development"'
    - if: '$CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+$/'

build:orchestrator:
  <<: *build_template
  script:
    - |
      DESTINATION="--destination ${ORCHESTRATOR_IMAGE}:${CI_COMMIT_SHORT_SHA}"
      if [ "$CI_COMMIT_TAG" != "" ]; then
        DESTINATION="$DESTINATION --destination ${ORCHESTRATOR_IMAGE}:${CI_COMMIT_TAG}"
      fi
      if [ "$CI_COMMIT_BRANCH" = "development" ]; then
        DESTINATION="$DESTINATION --destination ${ORCHESTRATOR_IMAGE}:dev"
      fi
      /kaniko/executor \
        --context "${CI_PROJECT_DIR}" \
        --dockerfile "${CI_PROJECT_DIR}/Dockerfile" \
        $DESTINATION \
        --cache=true \
        --cache-repo "${REGISTRY}/${IMAGE_PREFIX}/cache" \
        --insecure-registry=false

build:agent:
  <<: *build_template
  script:
    - |
      DESTINATION="--destination ${AGENT_IMAGE}:${CI_COMMIT_SHORT_SHA}"
      if [ "$CI_COMMIT_TAG" != "" ]; then
        DESTINATION="$DESTINATION --destination ${AGENT_IMAGE}:${CI_COMMIT_TAG}"
      fi
      if [ "$CI_COMMIT_BRANCH" = "development" ]; then
        DESTINATION="$DESTINATION --destination ${AGENT_IMAGE}:dev"
      fi
      /kaniko/executor \
        --context "${CI_PROJECT_DIR}/Agent" \
        --dockerfile "${CI_PROJECT_DIR}/Agent/Dockerfile" \
        $DESTINATION \
        --cache=true \
        --cache-repo "${REGISTRY}/${IMAGE_PREFIX}/cache" \
        --insecure-registry=false

# ─── Release: update deploy repo via MR (GitOps) ────────────────

release:deploy-pr:
  stage: release
  image: alpine/git:latest
  variables:
    GIT_STRATEGY: none
  before_script:
    - apk add --no-cache curl jq
    - curl -sL https://github.com/mikefarah/yq/releases/download/v4.40.5/yq_linux_amd64 -o /usr/bin/yq
    - chmod +x /usr/bin/yq
  script:
    - CLONE_URL="https://argocd-deploy:${DEPLOY_REPO_TOKEN}@gitlab.capturecore.org/ai/hivemind-deploy.git"
    - git clone "$CLONE_URL" /tmp/hivemind-deploy
    - cd /tmp/hivemind-deploy
    - git config user.name "GitLab CI"
    - git config user.email "ci@gitlab.capturecore.org"
    - BRANCH="release/${CI_COMMIT_TAG}"
    - git checkout -b "$BRANCH"
    - |
      yq -i ".images[] |= select(.name | test(\"orchestrator\")).newTag = \"${CI_COMMIT_TAG}\"" \
        orchestrator/base/kustomization.yaml
      yq -i ".images[] |= select(.name | test(\"opencode\")).newTag = \"${CI_COMMIT_TAG}\"" \
        orchestrator/base/kustomization.yaml
    - git add -A
    - |
      git commit -m "release: update image tags to ${CI_COMMIT_TAG}" || exit 0
    - git push origin "$BRANCH"
    - |
      curl --request POST --header "PRIVATE-TOKEN: ${DEPLOY_REPO_TOKEN}" \
        --data "source_branch=${BRANCH}" \
        --data "target_branch=main" \
        --data "title=Release ${CI_COMMIT_TAG}" \
        "https://gitlab.capturecore.org/api/v4/projects/ai%2Fhivemind-deploy/merge_requests"
  environment:
    name: production
  rules:
    - if: '$CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+$/'
      when: manual
  allow_failure: true