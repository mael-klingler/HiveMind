stages:
  - test
  - build
  - deploy

variables:
  REGISTRY: reg.capturecore.org
  IMAGE_PREFIX: hivemind
  ORCHESTRATOR_IMAGE: ${REGISTRY}/${IMAGE_PREFIX}/hivemind-orchestrator
  AGENT_IMAGE: ${REGISTRY}/${IMAGE_PREFIX}/hivemind-opencode
  DOCKER_TLS_CERTDIR: ""
  DOCKER_HOST: tcp://docker:2375
  DOCKER_DRIVER: overlay2

test:orchestrator:
  stage: test
  image: golang:1.23-alpine
  before_script:
    - apk add --no-cache git gcc musl-dev curl bash
    - curl -fsSL https://just.systems/install.sh | bash -s -- --to /usr/local/bin
    - just --version
    - go mod download
  script:
    - just ci-go
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH == "main"'
    - if: '$CI_COMMIT_BRANCH == "development"'

test:python:
  stage: test
  image: python:3.11-slim
  before_script:
    - apt-get update && apt-get install -y curl && rm -rf /var/lib/apt/lists/*
    - curl -fsSL https://just.systems/install.sh | bash -s -- --to /usr/local/bin
    - just --version
    - pip install -r Orchestrator/requirements.txt pytest
  script:
    - just ci-python
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH == "main"'
    - if: '$CI_COMMIT_BRANCH == "development"'

build:orchestrator:
  stage: build
  image: docker:27-dind
  services:
    - name: docker:27-dind
      command: ["--tls=false", "--insecure-registry=reg.capturecore.org"]
      alias: docker
  variables:
    DOCKER_HOST: tcp://docker:2375
    DOCKER_TLS_CERTDIR: ""
    DOCKER_DRIVER: overlay2
  before_script:
    - apk add --no-cache curl bash
    - curl -fsSL https://just.systems/install.sh | bash -s -- --to /usr/local/bin
    - echo "${HARBOR_ROBOT_TOKEN}" | docker login ${REGISTRY} -u 'robot$hivemind+hivemind-ci' --password-stdin
  script:
    - ORCHESTRATOR_TAG="${CI_COMMIT_SHORT_SHA}"
    - |
      if [ "$CI_COMMIT_BRANCH" = "main" ]; then
        ORCHESTRATOR_TAG="latest"
      fi
    - just docker-build-go
    - docker push ${ORCHESTRATOR_IMAGE}:${ORCHESTRATOR_TAG}
    - docker push ${ORCHESTRATOR_IMAGE}:${CI_COMMIT_SHORT_SHA}
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
    - if: '$CI_COMMIT_BRANCH == "development"'

build:agent:
  stage: build
  image: docker:27-dind
  services:
    - name: docker:27-dind
      command: ["--tls=false", "--insecure-registry=reg.capturecore.org"]
      alias: docker
  variables:
    DOCKER_HOST: tcp://docker:2375
    DOCKER_TLS_CERTDIR: ""
    DOCKER_DRIVER: overlay2
  before_script:
    - apk add --no-cache curl bash
    - curl -fsSL https://just.systems/install.sh | bash -s -- --to /usr/local/bin
    - echo "${HARBOR_ROBOT_TOKEN}" | docker login ${REGISTRY} -u 'robot$hivemind+hivemind-ci' --password-stdin
  script:
    - AGENT_TAG="${CI_COMMIT_SHORT_SHA}"
    - |
      if [ "$CI_COMMIT_BRANCH" = "main" ]; then
        AGENT_TAG="latest"
      fi
    - just docker-build-agent
    - docker push ${AGENT_IMAGE}:${AGENT_TAG}
    - docker push ${AGENT_IMAGE}:${CI_COMMIT_SHORT_SHA}
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
    - if: '$CI_COMMIT_BRANCH == "development"'

deploy:update-manifests:
  stage: deploy
  image: alpine/git:latest
  variables:
    GIT_SSL_NO_VERIFY: "1"
  script:
    - CLONE_URL="https://argocd-deploy:${DEPLOY_REPO_TOKEN}@gitlab.capturecore.org/ai/hivemind-deploy.git"
    - git clone "$CLONE_URL" /tmp/hivemind-deploy
    - "sed -i 's/newTag:.*/newTag: latest/' /tmp/hivemind-deploy/orchestrator/base/kustomization.yaml"
    - cd /tmp/hivemind-deploy
    - git config user.name "GitLab CI"
    - git config user.email "ci@gitlab.capturecore.org"
    - git add -A
    - COMMIT_MSG="auto-update image tags to latest"
    - git diff --cached --quiet || git commit -m "$COMMIT_MSG"
    - git push origin HEAD:main
  environment:
    name: production
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
      when: manual