services:
  orchestrator-serve:
    build:
      context: .
      dockerfile: Dockerfile
    image: hivemind/orchestrator-go:latest
    container_name: orchestrator-serve
    command: ["-serve"]
    environment:
      - DATABASE_URL=postgres://hivemind:${POSTGRES_PASSWORD:-hivemind}@hivemind-postgres-local:5432/hivemind?sslmode=disable
      - REDIS_URL=redis://hivemind-redis-local:6379
      - GITLAB_HOST=${GITLAB_HOST}
      - GITLAB_TOKEN=${GITLAB_TOKEN}
      - GITLAB_WEBHOOK_SECRET=${GITLAB_WEBHOOK_SECRET:-}
      - GITHUB_WEBHOOK_SECRET=${GITHUB_WEBHOOK_SECRET:-}
      - OLLAMA_HOST=${OLLAMA_HOST:-http://host.docker.internal:11434}
      - OLLAMA_BASE_URL=${OLLAMA_BASE_URL:-http://host.docker.internal:11434/v1}
      - OLLAMA_MODEL=${OLLAMA_MODEL:-glm-5.1:cloud}
      - OPENCODE_MODEL=${OPENCODE_MODEL:-glm-5.1:cloud}
      - AGENT_NAMESPACE=hivemind
      - AGENT_IMAGE=hivemind-opencode:latest
      - HIVEMIND_API_KEY=${HIVEMIND_API_KEY:-}
      - CORS_ORIGINS=${CORS_ORIGINS:-http://localhost:8080}
      - VCS_PROVIDER=${VCS_PROVIDER:-gitlab}
      - AGENT_PERM_WRITE=${AGENT_PERM_WRITE:-allow}
      - AGENT_PERM_BASH=${AGENT_PERM_BASH:-allow}
      - AGENT_PERM_EXT_DIR=${AGENT_PERM_EXT_DIR:-allow}
      - AGENT_PERM_DOOM_LOOP=${AGENT_PERM_DOOM_LOOP:-deny}
    ports:
      - "8080:8080"
    depends_on:
      hivemind-postgres-local:
        condition: service_healthy
      hivemind-redis-local:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8080/healthz"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 15s
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "1.0"
    profiles:
      - full-local

  hivemind-postgres-local:
    image: postgres:16-alpine
    container_name: hivemind-postgres-local
    environment:
      POSTGRES_USER: hivemind
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-hivemind}
      POSTGRES_DB: hivemind
    volumes:
      - hivemind-pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hivemind"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    profiles:
      - full-local

  hivemind-redis-local:
    image: redis:7-alpine
    container_name: hivemind-redis-local
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - hivemind-redis-data:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    profiles:
      - full-local

  prometheus:
    image: prom/prometheus:latest
    container_name: hivemind-prometheus
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    ports:
      - "9090:9090"
    restart: unless-stopped
    profiles:
      - monitoring

  grafana:
    image: grafana/grafana:latest
    container_name: hivemind-grafana
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:-admin}
      - GF_AUTH_ANONYMOUS_ENABLED=true
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Viewer
    volumes:
      - grafana-data:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "3000:3000"
    depends_on:
      - prometheus
    restart: unless-stopped
    profiles:
      - monitoring

volumes:
  hivemind-pgdata:
  hivemind-redis-data:
  prometheus-data:
  grafana-data: